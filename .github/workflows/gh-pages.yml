name: Publish to the gh-pages branch

# A zero-settings fallback: this publishes the site by pushing it to a
# `gh-pages` branch, which GitHub serves automatically at
# https://<owner>.github.io/<repo>/ — no repository settings required.
#
# Use this when GitHub Pages has not been enabled for the repository and you
# would rather not turn it on. If you do enable GitHub Pages (Settings →
# Pages → Source → GitHub Actions), the pages.yml workflow takes over and this
# workflow can be left alone; the two are independent.
#
# This uses plain git rather than a third-party action, so the only thing
# running in CI is GitHub's own tooling.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          set -euo pipefail
          python3 scripts/build.py
          test -f site/index.html

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A dedicated worktree holding the published site, so we never touch
          # the checkout the build ran in. The branch may not exist yet on the
          # first run, so fall back to a detached HEAD and create it on push.
          rm -rf .publish
          if git worktree add .publish gh-pages 2>/dev/null; then
            :
          else
            git worktree add --detach .publish
          fi

          # Empty the branch, then copy the fresh build in. The worktree's
          # .git file must survive, or git would fall back to the parent
          # repository and push the wrong content.
          find .publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. .publish/

          cd .publish
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Site is already up to date on gh-pages; nothing to publish."
            exit 0
          fi
          git commit -m "Publish site from ${GITHUB_SHA}"
          # Create the branch on the remote if this is the first publish.
          git push origin HEAD:refs/heads/gh-pages

      - name: Summary
        run: |
          {
            echo "## gh-pages branch"
            echo ""
            echo "- Status: published"
            echo "- Branch: \`gh-pages\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"
