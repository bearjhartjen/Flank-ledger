name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          set -euo pipefail
          python3 scripts/build.py
          test -f site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pagescheck
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # The /pages endpoint is not readable anonymously, so ask the repos
          # endpoint for the has_pages flag instead, which is accurate for
          # public repositories and carries the right permission here.
          has_pages=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" \
            | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('has_pages')).lower())" 2>/dev/null || echo "")
          echo "has_pages=$has_pages" >> "$GITHUB_OUTPUT"
          if [ "$has_pages" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository, so nothing was published. This is a one-time setup: open $GITHUB_SERVER_URL/$REPO/settings/pages and set Source to 'GitHub Actions', then push again."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pagescheck.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summary
        if: always()
        env:
          ENABLED: ${{ steps.pagescheck.outputs.enabled }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## GitHub Pages"
            echo ""
            if [ "$ENABLED" = "true" ]; then
              echo "- Status: deployed"
              echo "- URL: ${PAGE_URL:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}}"
            else
              echo "- Status: **not published**"
              echo ""
              echo "GitHub Pages is switched off for this repository. Turn it on once:"
              echo ""
              echo "1. Open $GITHUB_SERVER_URL/${{ github.repository }}/settings/pages"
              echo "2. Under **Build and deployment → Source**, choose **GitHub Actions**"
              echo "3. Push again"
              echo ""
              echo "The site builds fine either way — only the publishing step was skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
