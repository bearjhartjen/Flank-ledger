name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          set -euo pipefail
          python3 scripts/build.py
          test -f site/index.html

      - name: Check for Cloudflare credentials
        id: creds
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$API_TOKEN" ] && [ -n "$ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are not set, so nothing was deployed. This is a one-time setup — see CLOUDFLARE.md in the repository."
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=flank-ledger --branch=main

      - name: Summary
        if: always()
        env:
          CONFIGURED: ${{ steps.creds.outputs.configured }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Cloudflare Pages"
            echo ""
            if [ "$CONFIGURED" = "true" ]; then
              echo "- Status: deployed"
              echo "- Project: \`flank-ledger\`"
              echo "- Branch: \`main\`"
              echo "- Commit: \`${{ github.sha }}\`"
              if [ -n "$DEPLOY_URL" ]; then
                echo "- URL: $DEPLOY_URL"
              fi
            else
              echo "- Status: **not published**"
              echo ""
              echo "The repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not set."
              echo "Set them once (see \`CLOUDFLARE.md\`), then push again."
              echo ""
              echo "The site builds fine either way — only the publishing step was skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
